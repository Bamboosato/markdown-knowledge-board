<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Phase 3 PWA icon samples</title>
  <desc id="desc">Three dark app icon concepts for Markdown Knowledge Board, with Markdown Board selected and circular mask previews.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101828" flood-opacity="0.13" />
    </filter>

    <symbol id="icon-a" viewBox="0 0 280 280">
      <rect width="280" height="280" rx="62" fill="#1d1d1d" />
      <rect x="55" y="68" width="170" height="144" rx="22" fill="none" stroke="#ffffff" stroke-width="12" />
      <path d="M82 164V112L112 142L142 112V164" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M181 109V162M160 141L181 162L202 141" fill="none" stroke="#75a7ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <symbol id="icon-b" viewBox="0 0 280 280">
      <rect width="280" height="280" rx="62" fill="#1d1d1d" />
      <rect x="78" y="55" width="139" height="154" rx="19" fill="#858585" opacity="0.42" />
      <rect x="62" y="70" width="139" height="154" rx="19" fill="#ffffff" />
      <circle cx="86" cy="100" r="8" fill="#75a7ff" />
      <path d="M107 100H174M84 130H178M84 158H163M84 186H142" fill="none" stroke="#1d1d1d" stroke-width="11" stroke-linecap="round" />
      <path d="M173 58V95M154 77H192" fill="none" stroke="#75a7ff" stroke-width="12" stroke-linecap="round" />
    </symbol>

    <symbol id="icon-c" viewBox="0 0 280 280">
      <rect width="280" height="280" rx="62" fill="#1d1d1d" />
      <rect x="58" y="58" width="164" height="164" rx="28" fill="none" stroke="#ffffff" stroke-width="11" />
      <path d="M94 143L132 103L178 127M132 103L150 177M94 143L150 177M178 127L150 177" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
      <circle cx="94" cy="143" r="15" fill="#ffffff" />
      <circle cx="132" cy="103" r="15" fill="#75a7ff" />
      <circle cx="178" cy="127" r="15" fill="#ffffff" />
      <circle cx="150" cy="177" r="15" fill="#75a7ff" />
    </symbol>

    <clipPath id="mask-a"><circle cx="0" cy="0" r="54" /></clipPath>
    <clipPath id="mask-b"><circle cx="0" cy="0" r="54" /></clipPath>
    <clipPath id="mask-c"><circle cx="0" cy="0" r="54" /></clipPath>
  </defs>

  <rect width="1400" height="620" fill="#f4f6f8" />
  <text x="50" y="62" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Phase 3 PWA icon samples</text>
  <text x="50" y="94" fill="#596273" font-family="Arial, Helvetica, sans-serif" font-size="17">Dark board, white symbol, blue interaction accent. Circular previews approximate a maskable crop.</text>

  <g transform="translate(50 120)">
    <rect width="400" height="450" rx="28" fill="#ffffff" filter="url(#shadow)" />
    <rect x="2" y="2" width="396" height="446" rx="26" fill="none" stroke="#75a7ff" stroke-width="4" />
    <use href="#icon-a" x="44" y="36" width="280" height="280" />
    <g transform="translate(330 280)">
      <circle r="59" fill="#ffffff" stroke="#d3d7de" stroke-width="4" />
      <g clip-path="url(#mask-a)">
        <use href="#icon-a" x="-54" y="-54" width="108" height="108" />
      </g>
    </g>
    <text x="44" y="358" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">A. Markdown Board</text>
    <rect x="288" y="334" width="88" height="31" rx="15.5" fill="#e7f0ff" />
    <text x="304" y="356" fill="#235ebc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">SELECTED</text>
    <text x="44" y="388" fill="#596273" font-family="Arial, Helvetica, sans-serif" font-size="16">Most recognizable at small sizes.</text>
    <text x="44" y="416" fill="#596273" font-family="Arial, Helvetica, sans-serif" font-size="16">Directly matches the current design spec.</text>
  </g>

  <g transform="translate(500 120)">
    <rect width="400" height="450" rx="28" fill="#ffffff" filter="url(#shadow)" />
    <use href="#icon-b" x="44" y="36" width="280" height="280" />
    <g transform="translate(330 280)">
      <circle r="59" fill="#ffffff" stroke="#d3d7de" stroke-width="4" />
      <g clip-path="url(#mask-b)">
        <use href="#icon-b" x="-54" y="-54" width="108" height="108" />
      </g>
    </g>
    <text x="44" y="358" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">B. Note Stack</text>
    <text x="44" y="388" fill="#596273" font-family="Arial, Helvetica, sans-serif" font-size="16">Emphasizes notes and local editing.</text>
    <text x="44" y="416" fill="#596273" font-family="Arial, Helvetica, sans-serif" font-size="16">Friendly, but less Markdown-specific.</text>
  </g>

  <g transform="translate(950 120)">
    <rect width="400" height="450" rx="28" fill="#ffffff" filter="url(#shadow)" />
    <use href="#icon-c" x="44" y="36" width="280" height="280" />
    <g transform="translate(330 280)">
      <circle r="59" fill="#ffffff" stroke="#d3d7de" stroke-width="4" />
      <g clip-path="url(#mask-c)">
        <use href="#icon-c" x="-54" y="-54" width="108" height="108" />
      </g>
    </g>
    <text x="44" y="358" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">C. Knowledge Graph</text>
    <text x="44" y="388" fill="#596273" font-family="Arial, Helvetica, sans-serif" font-size="16">Emphasizes connected knowledge.</text>
    <text x="44" y="416" fill="#596273" font-family="Arial, Helvetica, sans-serif" font-size="16">Distinctive, but more abstract.</text>
  </g>
</svg>
